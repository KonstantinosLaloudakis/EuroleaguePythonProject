name: Refresh Analytics Data

on:
  schedule:
    # Regular season: '0 1 * * 3,4,5,6' (Wed-Sat)
    # Playoffs: daily — games can fall on any day
    - cron: '0 1 * * *'
  workflow_dispatch: # Manual trigger button in GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run refresh pipeline (skip WP model training — model is in repo)
      run: python refresh_all.py --skip-wp-train
      env:
        MPLBACKEND: Agg
      timeout-minutes: 30

    - name: Commit and push if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/data/ docs/*.json
        git add -f *.json *.png 2>/dev/null || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update analytics data" && git push)
